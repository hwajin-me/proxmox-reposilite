name: Validate scripts and settings
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Bash syntax
        run: bash -n ct/reposilite.sh ct/alpine-reposilite.sh install/reposilite-install.sh
      - name: Check metadata and configuration behavior
        run: python3 -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check
