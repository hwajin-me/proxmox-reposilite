name: Validate scripts and settings
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  # Fixed compatibility fixture; production installs still discover the release.
  REPOSILITE_COMPAT_VERSION: 3.6.5
  PVE_TOOLS_COMPAT_REVISION: 9b65262e4241e9c797e8113169c62a8ff8a659c3
  CORE_COMPAT_REVISION: 5acac4483be88990354dd4e3778e2cdce4df428e
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install shell validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck shfmt openjdk-21-jdk-headless
      - name: Prepare verified JDBC compatibility fixture
        run: |
          jar="$RUNNER_TEMP/reposilite-test.jar"
          url="https://maven.reposilite.com/releases/com/reposilite/reposilite/$REPOSILITE_COMPAT_VERSION/reposilite-$REPOSILITE_COMPAT_VERSION-all.jar"
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 "$url" -o "$jar"
          checksum="$(curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 "$url.sha256")"
          [[ "$checksum" =~ ^[[:xdigit:]]{64}$ ]]
          printf '%s  %s\n' "$checksum" "$jar" | sha256sum -c -
          printf 'REPOSILITE_TEST_JAR=%s\n' "$jar" >>"$GITHUB_ENV"
          printf 'REPOSILITE_TEST_JAVA=/usr/lib/jvm/java-21-openjdk-%s/bin/java\n' "$(dpkg --print-architecture)" >>"$GITHUB_ENV"
      - name: Prepare verified update integration fixtures
        run: |
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 60 "https://raw.githubusercontent.com/community-scripts/ProxmoxVE/$PVE_TOOLS_COMPAT_REVISION/tools/pve/update-apps.sh" -o "$RUNNER_TEMP/update-apps.sh"
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 60 "https://raw.githubusercontent.com/community-scripts/ProxmoxVE/$PVE_TOOLS_COMPAT_REVISION/tools/pve/update-lxcs.sh" -o "$RUNNER_TEMP/update-lxcs.sh"
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 60 "https://raw.githubusercontent.com/community-scripts/core/$CORE_COMPAT_REVISION/core/core.func" -o "$RUNNER_TEMP/core.func"
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 60 "https://raw.githubusercontent.com/community-scripts/core/$CORE_COMPAT_REVISION/misc/update.sh" -o "$RUNNER_TEMP/core-update.sh"
          printf '%s  %s\n' \
            f619846d1b0c4faeb7129294973fe3bc411ac983b68a610b585a056a782c1e4a "$RUNNER_TEMP/update-apps.sh" \
            b448501017c3d18eb80adbd841e261772abfd865238bcaa0b3c41c8f5c1bf622 "$RUNNER_TEMP/update-lxcs.sh" \
            38a782e0d05c805adea4e9f166cf10d8224c29176c41126e54a64d9ecb0b6be2 "$RUNNER_TEMP/core.func" \
            d94f719274995ad956ead12cde0582e3b04ae15d3a74a38ee3f2cea119124873 "$RUNNER_TEMP/core-update.sh" | sha256sum -c -
          printf '%s\n' \
            "REPOSILITE_UPDATE_APPS_FIXTURE=$RUNNER_TEMP/update-apps.sh" \
            "REPOSILITE_UPDATE_LXCS_FIXTURE=$RUNNER_TEMP/update-lxcs.sh" \
            "REPOSILITE_TEST_CORE_ENTRYPOINT=$RUNNER_TEMP/core.func" \
            "REPOSILITE_TEST_CORE_UPDATE=$RUNNER_TEMP/core-update.sh" >>"$GITHUB_ENV"
      - name: Check Bash syntax
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(git ls-files -z -- '*.sh')
      - name: Check shell behavior
        run: |
          # SC1090/SC1091: Core injects or dynamically sources its runtime.
          # SC2034/SC2154: Core consumes and supplies shared script globals.
          while IFS= read -r -d '' script; do
            shellcheck --exclude=SC1090,SC1091,SC2034,SC2154 "$script"
          done < <(git ls-files -z -- '*.sh')
      - name: Check shell formatting
        run: |
          while IFS= read -r -d '' script; do
            shfmt -d -i 2 -ci "$script"
          done < <(git ls-files -z -- '*.sh')
      - name: Check metadata and configuration behavior
        run: python3 -m unittest discover -s tests -v
      - name: Check Linux recovery authorization and locking
        run: sudo env PYTHONPATH=tests python3 -m unittest -v test_recovery.LinuxRecoveryGuardTests
      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^[[:xdigit:]]{40}$ ]] && git cat-file -e "$BASE_SHA^{commit}"; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
